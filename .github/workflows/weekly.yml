name: Weekly Firmware Build

on:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: Weekly Build
    uses: ApolloAutomation/Workflows/.github/workflows/esphome-ci.yml@main
    with:
      yaml-files: |
        Integrations/ESPHome/CAST_PRO-1.yaml
      # Same versions as ci.yml: the firmware needs ESPHome 2026.11
      # (min_version), so stable and beta fail until it ships there.
      esphome-versions: |
        dev
