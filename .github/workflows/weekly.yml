name: Weekly Firmware Build

on:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: Weekly Build
    uses: ApolloAutomation/Workflows/.github/workflows/esphome-ci.yml@main
    with:
      yaml-files: |
        Integrations/ESPHome/CAST_PRO-1.yaml
      # dev waits for the 2026.11 switch to the in-tree full-duplex i2s_audio
      esphome-versions: |
        stable
        beta
