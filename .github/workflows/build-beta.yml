name: Build and Publish Beta

# Publishes beta firmware to the rolling beta-fw pre-release, where the
# on-device Firmware Channel select points beta OTA updates.

on:
  push:
    branches: [beta]
    paths:
      - 'Integrations/ESPHome/**'
      # A push that only changes this file must rebuild too
      - '.github/workflows/build-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: write
    uses: ApolloAutomation/Workflows/.github/workflows/build-beta.yml@main
    with:
      # Key "" publishes manifest.json, the file devices fetch (ota_beta_manifest)
      variants: '[{"key": "", "yaml": "Integrations/ESPHome/CAST_PRO-1.yaml", "name": "firmware"}]'
      # The firmware needs ESPHome 2026.11 (min_version), which is only on dev
      # until 2026.11.0b1 ships. Set back to beta once it does.
      esphome-version: dev
